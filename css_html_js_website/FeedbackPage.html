    <p>How would you rate our site's quality?</p>
    <div class="rating">
        <script>
            function rateStar(element) {
                var stars = document.getElementsByClassName("star");
                var rating = 0;
                for (var i = 0; i < stars.length; i++) {
                    if (i < parseInt(element.dataset.rating)) {
                        stars[i].textContent = "★"; // Filled star
                    } else {
                        stars[i].textContent = "☆"; // Empty star
                    }
                    if (stars[i] === element) {
                        rating = parseInt(element.dataset.rating);
                    }
                }
                document.getElementById("result").textContent = "Rating: " + rating + " stars";
            }
        </script>
        <span class="star" onclick="rateStar(this)" data-rating="1">☆</span>
        <span class="star" onclick="rateStar(this)" data-rating="2">☆</span>
        <span class="star" onclick="rateStar(this)" data-rating="3">☆</span>
        <span class="star" onclick="rateStar(this)" data-rating="4">☆</span>
        <span class="star" onclick="rateStar(this)" data-rating="5">☆</span>
    </div>
    <br><br>
    <label><b>Tell us how we could improve our website:</b></label>
    <br>
<textarea id="feedbackText" onkeyup="countLetters()" cols="100" rows="10"></textarea>
<p id="letterCount">Letter count: 0</p>
<script>
function countLetters() {
   var text = document.getElementById("feedbackText").value;
   var count = text.length;
   document.getElementById("letterCount").innerHTML = "Letter count: " + count;
}
</script>
